    {% load static %}
    {% load widget_tweaks %}
    <!DOCTYPE html>
    <html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Nueva Contraseña</title>
    <!-- Bootstrap CSS -->
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
        
    <!-- Font Awesome -->
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet" type="text/css">
    
    <!-- SB Admin 2 CSS (opcional) -->
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    
    <!-- Estilos personalizados -->
    <style>
        .bg-gradient-primary {
            background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%) !important;
        }
        .btn-user {
            font-size: 0.8rem;
            border-radius: 10rem;
            padding: 0.75rem 1rem;
        }
    </style>
    <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/sb-admin-2.min.css' %}" rel="stylesheet">
    <style>
        .bg-gradient-primary {
            background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%) !important;
        }
    </style>
</head>
<body class="bg-gradient-primary">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card o-hidden border-0 shadow-lg my-5">
                    <div class="card-body p-0">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Crear nueva contraseña</h1>
                            </div>
                            <form method="post" class="user">
                                {% csrf_token %}
                                <div class="form-group">
                                    <label for="{{ form.new_password1.id_for_label }}">Nueva contraseña</label>
                                    {{ form.new_password1|add_class:"form-control form-control-user" }}
                                </div>
                                <div class="form-group">
                                    <label for="{{ form.new_password2.id_for_label }}">Confirmar contraseña</label>
                                    {{ form.new_password2|add_class:"form-control form-control-user" }}
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">
                                    Cambiar contraseña
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Los mismos scripts JS que en los otros templates -->
</body>
</html>
